<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Flask テンプレート{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <!-- ナビゲーションバー -->
    <nav>
        <a href="{{ url_for('index') }}">🏠 ホーム</a>
        <a href="{{ url_for('form_page') }}">📝 フォーム</a>
        <a href="{{ url_for('database_page') }}">🗄️ データベース</a>
        <a href="{{ url_for('api_page') }}">🌐 外部API</a>
        <a href="{{ url_for('auth_page') }}">🔐 ログイン</a>
    </nav>

    <!-- フラッシュメッセージ（通知表示） -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <!-- メインコンテンツ（各ページの内容がここに入る） -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
