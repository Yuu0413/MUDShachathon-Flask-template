{% extends "base.html" %}

{% block title %}フォーム | Flask テンプレート{% endblock %}

{% block content %}
<div class="container">
    <h1>📝 フォームサンプル</h1>
    <p>フォームからデータを送信して、Flaskで受け取るサンプルです。</p>

    <form method="POST" action="{{ url_for('form_page') }}">
        <div class="form-group">
            <label for="name">名前</label>
            <input type="text" id="name" name="name" placeholder="例：山田太郎" required>
        </div>
        <div class="form-group">
            <label for="message">メッセージ</label>
            <textarea id="message" name="message" rows="4" placeholder="メッセージを入力..." required></textarea>
        </div>
        <button type="submit" class="btn">送信する</button>
    </form>

    <!-- 送信結果の表示 -->
    {% if result %}
    <div class="result">
        <h2>受け取ったデータ</h2>
        <p><strong>名前：</strong>{{ result.name }}</p>
        <p><strong>メッセージ：</strong>{{ result.message }}</p>
    </div>
    {% endif %}
</div>
{% endblock %}
